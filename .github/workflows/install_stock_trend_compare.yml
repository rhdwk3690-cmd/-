      - name: "Commit only the two changed modules"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend_candidates_ui.py stock_analysis_ui.py
          if git diff --cached --quiet; then
            echo "No changes (already installed)"
          else
            git commit -m "feat: add multi-stock RS DMI ADX ATR watchlist"
            git pull --rebase
            git push
          fi
