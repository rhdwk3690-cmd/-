          sources = {
              'scripts/collect_dart_quarters.py': base64.b64decode(''.join(collector_b64.split())).decode('utf-8'),
              'quarter_fundamentals_ui.py': base64.b64decode(''.join(ui_b64.split())).decode('utf-8'),
          }
          for name, content in sources.items():
              ast.parse(content, filename=name)
              path = Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              if path.exists():
                  print('Existing collector/UI kept (no overwrite):',name)
              else:
                  path.write_text(content,encoding='utf-8')
                  print('Installed:',name)

          # Add quarterly evidence table without changing validated RS/DMI metrics.
          trend = Path('trend_candidates_ui.py')
          content = trend.read_text(encoding='utf-8')
          marker='MINER_DART_YOY_QOQ_TABLE_V1'
          before="        st.dataframe(frame, hide_index=True, use_container_width=True)"
          after=("        # MINER_DART_YOY_QOQ_TABLE_V1\n"
                 "        from quarter_fundamentals_ui import enrich_comparison\n"
                 "        frame, dart_ready = enrich_comparison(frame)\n"
                 "        if not dart_ready:\n"
                 "            st.caption('OpenDART 분기 실적 미수집 · 설치 후 수집 실행 시 YoY/QoQ 열 표시')\n"
                 "        st.dataframe(frame, hide_index=True, use_container_width=True)")
          if marker not in content:
              if content.count(before)!=1:raise RuntimeError('trend_candidates_ui.py patch anchor mismatch, refusing to modify')
              content=content.replace(before,after,1)
              ast.parse(content,filename=str(trend))
              trend.write_text(content,encoding='utf-8')
              print('Added YoY/QoQ to comparison table')
          else:print('Existing YoY/QoQ comparison UI left intact')

          study = Path('stock_analysis_ui.py')
          content = study.read_text(encoding='utf-8')
          before=("    with st.expander('📄 실적·증권사 리포트 연결 계획'):\n"
                  "        st.info('OpenDART 분기 성장률·영업이익률, 리포트 목표주가 변화를 검증된 출처와 발표일 기준으로 연결할 예정입니다. 아직 자동 수집·리포트 평가 기능은 활성화되지 않았습니다.')")
          after=("    # MINER_DART_YOY_QOQ_STOCK_V1\n"
                 "    from quarter_fundamentals_ui import render_stock_quarter\n"
                 "    render_stock_quarter(code)")
          if 'MINER_DART_YOY_QOQ_STOCK_V1' not in content:
              if content.count(before)!=1: raise RuntimeError('stock_analysis_ui.py patch anchor mismatch, refusing to modify')
              content=content.replace(before,after,1)
              ast.parse(content,filename=str(study))
              study.write_text(content,encoding='utf-8')
              print('Added official quarter results below stock trend')
          else:print('Existing stock YoY/QoQ UI left intact')
          PY_INSTALL
      - name: Install minimal data collector dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run offline quarterly accounting tests
        run: python scripts/collect_dart_quarters.py --selftest
      - name: Collect official OpenDART latest reported quarters
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODES: ${{ inputs.stock_codes || '' }}
        run: python scripts/collect_dart_quarters.py
      - name: Commit verified data + installed UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect_dart_quarters.py quarter_fundamentals_ui.py stock_analysis_ui.py trend_candidates_ui.py data/kr_dart_quarters.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: DART YoY QoQ quarterly fundamentals on stock research'
            git pull --rebase origin main
            git push origin main
          else
            echo 'No changed financial data or UI'
          fi
