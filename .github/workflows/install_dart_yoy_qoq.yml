name: "INSTALL and COLLECT: OpenDART quarterly YoY QoQ"
on:
  workflow_dispatch:
    inputs:
      stock_codes:
        description: "Optional 6-digit stock codes separated by commas; blank = rotate through all TOP200"
        required: false
        type: string
        default: ""
  schedule:
    # Weekdays 18:50 KST = 09:50 UTC. Daily BATCH, not a 40-stock universe cap.
    - cron: '50 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: miner-dart-quarter-financials
  cancel-in-progress: false
