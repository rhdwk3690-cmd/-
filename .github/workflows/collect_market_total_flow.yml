name: Collect KR full-market investor net flows (modern Naver JSON)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: miner-kr-eod-all
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate public Naver Stock daily KRX investor amounts
        run: python scripts/collect_market_total_flow.py
      - name: Commit only verified market totals
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/kr_market_total_flow.json ]; then
            git add data/kr_market_total_flow.json
            if ! git diff --cached --quiet; then
              git commit -m 'data: update validated total-market investor flows'
              git push
            fi
          fi
