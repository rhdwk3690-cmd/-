name: Collect market snapshot
on:
  workflow_dispatch:
  schedule:
    # KST 09:07-15:57, weekdays (UTC 00:07-06:57); 30-minute interval
    - cron: '7,37 0-6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check yfinance pandas
      - name: Collect snapshot
        run: python scripts/collect_market.py
      - name: Commit updated snapshot only if data has changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh market snapshot'
            git push
          fi
