name: Collect official KOFIA liquidity and activate market signal
on:
  workflow_dispatch:
  schedule:
    # Weekdays 19:25 Korea time (UTC+9); KOFIA data might still reflect prior business day.
    - cron: '25 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: miner-kofia-liquidity
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read official FreeSIS daily deposits and credit balances; validate dates and homepage anchor
        run: python scripts/collect_kofia_liquidity.py
      - name: Activate official credit and deposits view only after verified source data
        run: python scripts/activate_kofia_liquidity_ui.py
      - name: Commit official dated statistics and the narrow UI replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kr_kofia_liquidity.json app.py
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify official KOFIA deposits and credit; show in market signal'
            git push
          fi
