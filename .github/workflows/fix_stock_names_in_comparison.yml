      - name: Offline stock-name resolution checks (no Yahoo calls)
        shell: bash
        run: |
          python - <<'PY_TEST'
          import ast, json, re
          from pathlib import Path
          src=Path('trend_candidates_ui.py').read_text(encoding='utf-8')
          tree=ast.parse(src, filename='trend_candidates_ui.py')
          assert '# MINER_STOCK_NAMES_V2' in src
          assert "front = ['순위', '종목명', '종목코드']" in src
          assert "key='miner_trend_compare_names_v2'" in src
          funcs={'normalize_name','load_stock_names','resolve_symbols','symbols_from_text'}
          isolated=ast.Module(body=[n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in funcs],type_ignores=[])
          assert len(isolated.body)==len(funcs)
          env={'json':json,'re':re,'Path':Path,'ROOT':Path.cwd(),'MAX_MANUAL_SYMBOLS':15}
          exec(compile(isolated,'trend_name_functions','exec'),env)
          names,codes,lookup,day=env['load_stock_names']()
          expected={'005930.KS':'삼성전자','000660.KS':'SK하이닉스','035420.KS':'NAVER','035720.KS':'카카오'}
          for code,name in expected.items():
              assert names.get(code)==name,(code,names.get(code))
          q=env['resolve_symbols']('삼성전자, SK하이닉스, 네이버, 카카오', names,codes,lookup)
          assert list(q)==list(expected),q
          assert q==expected,q
          alias=env['resolve_symbols']('NAVER, 005930, 000660.KS, 035720.KS',names,codes,lookup)
          assert list(alias)==['035420.KS','005930.KS','000660.KS','035720.KS'],alias
          assert len(env['resolve_symbols']('삼성전자, 005930.KS',names,codes,lookup))==1
          for invalid in ('실존하지않는종목','005930.KQ'):
              try: env['resolve_symbols'](invalid,names,codes,lookup)
              except ValueError: pass
              else: raise AssertionError(f'Invalid token accepted: {invalid}')
          assert env['symbols_from_text']('삼성전자, SK하이닉스')==['005930.KS','000660.KS']
          print('PASS: Korean-name inputs, alias, ticker lookup, duplicate handling, unknown name, mismatched market')
          print('PASS: result table displays name before code; directory date',day)
          PY_TEST
