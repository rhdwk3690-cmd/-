name: Collect KR flows (EOD)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kr-eod-flow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check pandas requests finance-datareader
      - name: Collect EOD market ranking
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/collect_kr_flow.py
      - name: Commit EOD data when changed
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/kr_flow.json ]; then
            git add data/kr_flow.json
            if ! git diff --cached --quiet; then
              git commit -m 'data: refresh KR ranking diagnostic'
              git push
            fi
          fi
