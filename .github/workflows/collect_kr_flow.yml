name: Collect KR flows (EOD)
on:
  workflow_dispatch:
  schedule:
    # 18:37 KST Mon-Fri (09:37 UTC), after typical final investor figures publication
    - cron: '37 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kr-eod-flow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check 'pykrx>=1.0.45' pandas requests
      - name: Collect EOD market flow
        run: python scripts/collect_kr_flow.py
      - name: Commit EOD snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kr_flow.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh KR end-of-day flow'
            git push
          fi
