      - name: Check for lookahead and false result reporting
        run: |
          python -m py_compile experiments/techno_entry_pilot.py tests/test_techno_entry_pilot.py
          python -m unittest discover -s tests -p 'test_techno_entry_pilot.py' -v
      - name: Run real-data entry-signal experiment (not a fundamental/portfolio backtest)
        run: |
          python experiments/techno_entry_pilot.py --universe data/kr_flow.json --out experiment_outputs/techno_entry_v1
      - name: Publish research status and actual outcomes to GitHub job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('experiment_outputs/techno_entry_v1')
          dest=os.environ.get('GITHUB_STEP_SUMMARY')
          lines=['## 광부 A/B/C 가격 신호 연구 (실적 필터 미포함)',
                 '', '**중요:** 이 표는 수익률 전략 백테스트가 아닌 다음날 시가 기준 이벤트 연구입니다.',
                 '현재 TOP200의 과거 가격만 추적했으므로 생존편향이 있으며, 업종은 현재 분류입니다.',
                 '공시일 기준 분기실적, 가치평가, 포지션 운용, CAGR·MDD는 검증하지 않았습니다.', '']
          file=out/'summary.json'
          if file.exists():
              j=json.loads(file.read_text(encoding='utf-8'))
              lines+=['| 전략 | 미래 거래일 | 실현 관측 | 평균 수익률(%) | 시장 대비 평균(%p) | 표본 상태 |',
                      '|---|---:|---:|---:|---:|---|']
              for x in j['results']:
                  ret='—' if x['mean_net_return_pct'] is None else str(x['mean_net_return_pct'])
                  exc='—' if x['mean_market_excess_pct'] is None else str(x['mean_market_excess_pct'])
                  lines.append(f"| {x['strategy']} | {x['horizon_sessions']} | {x['events_mature']} | {ret} | {exc} | {x['status']} |")
          else:
              lines+=['**실험 미완료:** 신뢰 가능한 결과 파일이 없습니다. 수집 로그와 아래 원천 진단 파일을 확인하세요.']
          src=out/'source_and_coverage.json'
          if src.exists():
              x=json.loads(src.read_text(encoding='utf-8'))
              lines+=['',f"가격 원천 확보: {x.get('eligible_stocks',0)}/200개 종목",
                      f"업종 분류: {x.get('sector_status','미확인')}"]
              if x.get('blocked_reason'):lines.append(f"차단 사유: {x['blocked_reason']}")
          if dest:
              with open(dest,'a',encoding='utf-8') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Attach source coverage, event-level CSV and comparison tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miner-techno-entry-pilot-v1
          path: experiment_outputs/techno_entry_v1/
          if-no-files-found: warn
          retention-days: 21
