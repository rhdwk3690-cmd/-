name: Collect KR EOD data (single 18:35 batch)
on:
  workflow_dispatch:
  schedule:
    # Weekdays 18:35 Korea (09:35 UTC), published source dates preserved.
    - cron: '35 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: miner-kr-eod-all
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing collector dependencies
        run: python -m pip install --disable-pip-version-check requests pandas numpy
      - name: Collect existing market sources and bounded dated ADR20 in sequence
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/run_kr_eod_batch.py
      - name: Commit successfully validated snapshots and ADR detail patch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/kr_flow.json data/kr_investor_flow.json data/kr_market_total_flow.json data/kr_futures_flow.json data/kr_market_liquidity.json data/kr_kofia_liquidity.json data/kr_market_adr20.json miner_breadth.py; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified KR EOD market sources and stored ADR20'
            git push
          fi
