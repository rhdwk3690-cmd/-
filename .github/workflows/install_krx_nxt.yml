      - name: Validate all modified Python files and invariant
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            app.py flow_pages.py stock_analysis_ui.py \
            scripts/collect_kr_flow.py scripts/collect_nxt_trades.py scripts/collect_adr_breadth.py
          python scripts/collect_nxt_trades.py --self-test
          python - <<'PY_TEST'
          import importlib.util, json, tempfile
          from pathlib import Path
          src=Path('scripts/collect_kr_flow.py')
          spec=importlib.util.spec_from_file_location('miner_kr_flow_test',src)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          rows=[{'ticker':f'{i:06d}','name':f'company{i}',
                 'market':'KOSPI' if i<800 else 'KOSDAQ',
                 'close':1000,'traded_krw':1_000_000+i} for i in range(1600)]
          nxt={r['ticker']:{'market':r['market'],'traded_krw':900_000+i}
               for i,r in enumerate(rows[:450])}
          with tempfile.TemporaryDirectory() as d:
              m.ROOT=Path(d)
              (Path(d)/'data').mkdir()
              (Path(d)/'data'/'nxt_trades_eod.json').write_text(
                  json.dumps({'status':'verified','date':'2026-11-02','rows':nxt}),encoding='utf-8')
              got=m.build_unified_top200(rows,'2026-11-02')
              assert got['status']=='verified_partial_nxt_sessions',got
              assert len(got['top200'])==200
              assert got['top200'][0]['traded_krw']>=got['top200'][-1]['traded_krw']
              assert got['top200'][0]['traded_krw']==got['top200'][0]['krx_traded_krw']+got['top200'][0]['nxt_traded_krw']
              missing=m.build_unified_top200(rows,'2026-10-30')
              assert missing['status']=='awaiting_same_date_nxt',missing
          text=Path('app.py').read_text(encoding='utf-8')
          assert "st.Page(individual,title='종목분석'" in text
          assert 'from strategy_research_ui import render' in text
          assert 'st.Page(top200,' in text
          print('PASS: combined ranking consistency, date gate, existing research and TOP200')
          PY_TEST
          git diff --check
      - name: Bootstrap NXT date archive and refresh KRX ranking
        shell: bash
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python - <<'PY_SEED'
          import json, os
          from pathlib import Path
          p=Path('data/nxt_trades_eod.json')
          if p.is_file():
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('status')=='verified' and isinstance(d.get('date'),str) and isinstance(d.get('rows'),dict):
                  history=d.get('history') or {}
                  if not isinstance(history,dict):history={}
                  history[d['date']]=d['rows']
                  d['history']={day:history[day] for day in sorted(history)[-20:]}
                  tmp=p.with_suffix('.tmp')
                  tmp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  os.replace(tmp,p)
                  print('NXT archive seeded for',d['date'])
          PY_SEED
          python scripts/collect_kr_flow.py || echo '::warning::KRX stock source refresh unavailable; prior verified data retained'
          echo 'ADR collector already patched independently; leaving unchanged'
          python - <<'PY_DATE'
          import json
          from pathlib import Path
          for path in ('data/kr_flow.json','data/nxt_trades_eod.json'):
              p=Path(path)
              if p.is_file():
                  d=json.loads(p.read_text(encoding='utf-8'))
                  print(path,'date:',d.get('date') or d.get('latest_date'),
                        'unified:',(d.get('unified') or {}).get('status','n/a'))
          PY_DATE
      - name: Commit validated code and available dated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py flow_pages.py stock_analysis_ui.py \
            scripts/collect_kr_flow.py scripts/collect_nxt_trades.py \
            data/kr_flow.json data/nxt_trades_eod.json
          if git diff --cached --quiet; then
            echo 'No batch changes'; exit 0
          fi
          git commit -m 'feat: staged NXT history combined turnover and stock study'
          git pull --rebase origin main
          git push origin HEAD:main
          echo '### Batch patch installed and tested' >> "$GITHUB_STEP_SUMMARY"
          echo 'KRX-only investor flows, existing strategy research and account defense unchanged.' >> "$GITHUB_STEP_SUMMARY"
