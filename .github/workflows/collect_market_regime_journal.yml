name: Verify market-regime journal (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: miner-kr-eod-all
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install journal collector dependencies
        run: python -m pip install --disable-pip-version-check requests pandas numpy yfinance streamlit
      - name: Collect observed market decision and mature only realized horizons
        run: python scripts/collect_market_regime_journal.py
      - name: Commit validated journal only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kr_market_regime_journal.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: append observed market regime and mature realized index outcomes'
            git push
          fi
